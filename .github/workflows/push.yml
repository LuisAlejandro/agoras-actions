name: Build and push agoras docker image

on:
  workflow_dispatch:
    inputs:
      agoras_ref:
        description: Git ref of LuisAlejandro/agoras to bundle into the image
        required: true
        default: develop
  push:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout agoras-actions
        uses: actions/checkout@v6

      - name: Checkout agoras
        uses: actions/checkout@v6
        with:
          repository: LuisAlejandro/agoras
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.agoras_ref || 'develop' }}
          path: agoras-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github Packages registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Building docker image
        uses: docker/build-push-action@v7
        with:
          tags: ghcr.io/luisalejandro/agoras-actions:2.0.0
          file: docker/Dockerfile
          context: docker
          build-contexts: |
            agoras=./agoras-src
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          load: false
